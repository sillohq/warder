name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The interface is compiled into the wheel, so CI builds it once before
      # the tests: several of them assert that the bundle is actually served.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the interface
        run: npm ci && npm run build
        working-directory: ui

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The context API is the framework's v1, which is not on PyPI yet.
          pip install "sillo-framework @ git+https://github.com/sillohq/core@main"
          pip install "tortoise-orm>=0.21" httpx bcrypt
          pip install pytest pytest-asyncio pytest-cov ruff mypy
          pip install -e . --no-deps

      - name: Lint
        run: ruff check warder tests

      - name: Format
        run: ruff format --check warder tests

      - name: Types
        run: mypy warder --ignore-missing-imports

      - name: Types (interface)
        run: npx tsc --noEmit
        working-directory: ui

      - name: Test
        run: pytest --cov --cov-report=term-missing

  # The declaration layer is meant to be usable — and testable — without a
  # database, a connection, or a running application. This job proves it by
  # installing nothing but the package itself.
  bare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . --no-deps
      - name: Import and declare with no framework installed
        run: |
          python - <<'PY'
          import warder
          Post = type("Post", (), {})
          admin = warder.Admin(title="Bare")
          admin.add(warder.Resource(Post, list=warder.List(
              warder.Column("title", link=True),
              warder.Column.badge("status", {"live": "green"}),
              filters=[warder.Filter.choice("status", ["live"])],
              sort=warder.Sort.desc("created_at"),
          )))
          assert admin.check() == []
          assert admin.permissions[:1] == ("post.add",)
          print("declared without the framework:", admin)
          PY

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install build
      # build_ui.py runs Vite as part of this and fails the build if no
      # manifest comes out, because a wheel without its interface installs
      # cleanly and renders a blank page.
      - run: python -m build
      # The React sources are in the repository and never in the wheel:
      # installing an admin panel is not signing up to run Vite.
      - name: Check the wheel carries no UI sources
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert not any(n.startswith("ui/") for n in names), "ui/ leaked into the wheel"
          assert not any(n.endswith("package.json") for n in names), "npm files in the wheel"
          assert "warder/py.typed" in names, "py.typed is missing"
          assert "warder/static/manifest.json" in names, "the interface is missing"
          assert any(n.endswith(".js") for n in names), "no bundle in the wheel"
          assert any(n.endswith(".css") for n in names), "no stylesheet in the wheel"
          print("\n".join(n for n in names if not n.startswith("warder-")))
          PY
