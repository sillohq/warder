[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warder"
version = "0.1.0"
description = "A declarative admin for Sillo. Declarations are values, not class attributes, and a type annotation never selects behaviour."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    {name = "Chidebele Dunamis", email = "techwithdunamix@gmail.com"}
]
keywords = ["sillo", "admin", "crud", "declarative", "orm", "asgi", "inertia"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Front-Ends",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
# Warder is written against the **context API** — `HttpContext`, `ctx`-first
# handlers, and the free builders in `sillo.responses`. That is Sillo v1, which
# is on the framework's `main` branch and not yet on PyPI, so this pin will not
# resolve until v1 ships. Until then, install the framework from git first:
#
#     pip install "sillo-framework @ git+https://github.com/sillohq/core@main"
#     pip install warder --no-deps
#
# The pin is left honest rather than loosened to `>=0.3`: the released 0.x has
# no `sillo.responses` at all, so a wheel that installed against it would fail
# at the first request instead of at install time.
dependencies = ["sillo-framework>=1.0"]

# `>=1.0` cannot resolve against PyPI yet, so uv-based dev and CI take the
# framework from the branch that *is* 1.0 (its metadata still says 0.3.x).
# This is dev-only — it is not written into the built wheel. Drop it once 1.0
# publishes.
[tool.uv.sources]
sillo-framework = { git = "https://github.com/sillohq/core.git", branch = "main" }

[project.urls]
Homepage = "https://sillo.build"
Documentation = "https://docs.sillo.build/packages/warder/"
Source = "https://github.com/sillohq/warder"
Changelog = "https://github.com/sillohq/warder/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# The Inertia transport for the React interface. Optional because the
# declarations, the resolver and `admin.render` are useful without it.
ui = ["sillo-inertia>=0.0.1a4"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
warder = "warder.console:main"

[tool.hatch.build]
# The built bundle is generated, so it is in .gitignore -- and hatchling honours
# VCS ignore files. Naming it here is what puts it in the wheel anyway, which is
# the whole point of shipping an interface nobody has to build.
artifacts = ["warder/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["warder"]
# The React sources are in the repository and never in the wheel; the built
# assets they produce are, under warder/static/. Someone installing an admin
# panel is not signing up to run Vite.
exclude = ["ui", "ui/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
# Runs `npm ci && npm run build` in ui/ before packaging, and fails the build if
# no manifest comes out -- a wheel without its interface installs cleanly and
# renders a blank page.
path = "build_ui.py"

[tool.hatch.build.targets.sdist]
# The sdist carries ui/ so the wheel is reproducible from source.
include = [
    "warder",
    "ui/src",
    "ui/package.json",
    "ui/package-lock.json",
    "ui/tsconfig.json",
    "ui/vite.config.ts",
    "build_ui.py",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["warder"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if typing.TYPE_CHECKING:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# `format`, `list`, `bytes`, `bool`, `id`, `max`, `min` are the words for what
# these arguments are. A2/A3 would rename them into worse names.
ignore = [
    # `format`, `list`, `bytes`, `bool`, `id`, `max`, `min` are the words for
    # what these arguments are. Renaming them gives worse names.
    "A002",
    "A003",
    # __slots__ is in declaration order because it *is* the field order: it
    # drives `_fields`, `with_` and every repr. Sorting it would reorder the
    # public surface of every declaration.
    "RUF023",
]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
